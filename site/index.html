<!doctype html>
<html lang="fr" data-theme="lumiere">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ancestria</title>
    <!-- Carte de partage (05/10, « pas assez fluide le partage ») : Facebook, WhatsApp… lisent ces balises.
         L'image vit dans public/partage-ancestria.png (1200 × 630) ; adresse ABSOLUE obligatoire. -->
    <meta name="description" content="Ancestria — l’arbre de famille universel, gratuit pour tous. Retrouvez le nom de vos ancêtres et ajoutez votre famille, d’où qu’elle vienne." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ancestria" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://gasmar97430-code.github.io/ancestria-web/" />
    <meta property="og:title" content="Ancestria — l’arbre de famille universel" />
    <meta property="og:description" content="Gratuit pour tous. Retrouvez le nom de vos ancêtres et ajoutez votre famille, d’où qu’elle vienne." />
    <meta property="og:image" content="https://gasmar97430-code.github.io/ancestria-web/partage-ancestria.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ancestria, l’arbre de famille universel : l’Arbre de Vie, gratuit pour tous" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Mode téléphone (03/10) : le site s'installe comme une appli (public/manifest.webmanifest, public/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FBF8F1" />
    <link rel="apple-touch-icon" href="/icone-192.png" />
    <script>
      if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register(document.querySelector('link[rel=manifest]').href.replace(/manifest\.webmanifest$/, 'sw.js')).catch(function () {}); });
    </script>
    <script>
      // Adresse d'essai sur GitHub Pages (01/10) : un lien direct (/essai/c/<jeton>) arrive par la page 404,
      // qui le renvoie ici sous la forme ?/c/<jeton> (scripts/essai-404.mjs) ; on remet l'adresse d'origine.
      (function () {
        var q = window.location.search;
        if (q.slice(0, 2) !== '?/') return;
        var reste = q.slice(2).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
        window.history.replaceState(null, '', window.location.pathname.replace(/\/?$/, '/') + reste + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <link rel="stylesheet" href="/src-web/responsive/responsive.css" /><!-- 06/10 : PC + téléphone (src-web/responsive) -->
    <script type="module" src="/src-web/entree.tsx"></script>
  </body>
</html>
