<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- userSpaceOnUse est indispensable : en unites relatives (defaut), un
         trait parfaitement vertical ou horizontal a une boite englobante
         d'epaisseur nulle, et la spec SVG demande alors de ne rien peindre.
         Le tronc et les liaisons en pointilles disparaissaient. -->
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="100" y2="0">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D1FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Connections / Tree Structure -->
    <g stroke="url(#grad)" stroke-width="3" stroke-linecap="round" fill="none">
      <!-- Main Trunk -->
      <path d="M50 90 V30" />
      
      <!-- Level 1 Branches -->
      <path d="M50 70 L30 50 M50 70 L70 50" />
      
      <!-- Level 2 Branches -->
      <path d="M30 50 L20 30 M30 50 L40 30 M70 50 L60 30 M70 50 L80 30" />
      
      <!-- Network Connections (Inter-node links) -->
      <path d="M30 50 H70" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
      <path d="M20 30 H80" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
      <path d="M40 30 L50 30 L60 30" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- Nodes (The "Ancestors") -->
    <g fill="url(#grad)">
      <!-- Root/Apex -->
      <circle cx="50" cy="30" r="4" />
      <!-- Mid level -->
      <circle cx="30" cy="50" r="3" />
      <circle cx="70" cy="50" r="3" />
      <!-- Upper level -->
      <circle cx="20" cy="30" r="3" />
      <circle cx="40" cy="30" r="3" />
      <circle cx="60" cy="30" r="3" />
      <circle cx="80" cy="30" r="3" />
      <!-- Base -->
      <circle cx="50" cy="90" r="3" />
    </g>
  </g>
</svg>
