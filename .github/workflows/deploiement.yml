# Mise en ligne gratuite sur GitHub Pages.
# À chaque envoi sur la branche main : tous les essais (écran + base) sont
# rejoués ; si UN SEUL échoue, rien n'est publié.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Essais (logique, parité écran/base, schéma SQL)
        run: npm test
      - name: Contrôle des types (site + fonctions Supabase)
        run: npm run typecheck
      # ---- BASCULE (01/10/2026, sa demande : « le site au miroir de l'appli ») ----
      # L'adresse principale sert le NOUVEAU site (site/ = l'écran du PC) ; l'ancien (src/) n'est plus
      # publié — ses essais de base ci-dessus restent rejoués. L'adresse d'essai /essai/ reste servie.
      - name: Nouveau site — dépendances
        run: npm ci
        working-directory: site
      - name: Nouveau site — essais et types
        run: npx vitest run && npx tsc --noEmit -p .
        working-directory: site
      - name: Nouveau site — construction à l'adresse principale
        run: npx vite build --outDir ../dist --emptyOutDir
        working-directory: site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EMAIL_ADMINISTRATEUR: ${{ vars.VITE_EMAIL_ADMINISTRATEUR }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Nouveau site — même construction sous /essai/ (le lien déjà donné)
        run: npx vite build --outDir ../dist/essai --emptyOutDir
        working-directory: site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EMAIL_ADMINISTRATEUR: ${{ vars.VITE_EMAIL_ADMINISTRATEUR }}
          VITE_BASE: /${{ github.event.repository.name }}/essai/
      - name: Liens directs (/c/…) aux deux adresses
        run: node scripts/bascule-404.mjs /${{ github.event.repository.name }}/
      # ---- FIN BASCULE ----
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
